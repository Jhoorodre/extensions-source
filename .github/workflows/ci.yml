name: CI

on:
  push:
    branches: [nox]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Só o que o módulo precisa: o Gradle não varre as milhares de extensões do upstream.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            common
            compiler
            core
            gradle
            lib
            lib-multisrc
            src/pt/baozinho

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test, lint and assemble
        run: ./gradlew :src:pt:baozinho:testDebugUnitTest :src:pt:baozinho:lintRelease :src:pt:baozinho:assembleRelease --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baozinho-apk
          path: src/pt/baozinho/build/outputs/apk/release/*.apk
          retention-days: 30
